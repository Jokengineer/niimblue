name: Build Android app

# Собирает Android-приложение (APK) на серверах GitHub и выкладывает готовый
# файл в релиз "app-latest" — его можно скачать прямо на телефон и установить.
# Запускается вручную (кнопка Run workflow) или при изменениях кода/приложения.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "standalone-apps/**"
      - ".github/workflows/build-android-app.yml"

permissions:
  contents: write

env:
  CAPACITOR_PROJECT_DIR: ./standalone-apps/capacitor

jobs:
  build-android-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0"

      - name: Add build tools to PATH (for apksigner)
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Decode keystore
        run: |
          mkdir -p .keystore
          echo "$KEYSTORE_BASE_64" | base64 -d > .keystore/keystore.jks
        env:
          KEYSTORE_BASE_64: ${{ secrets.KEYSTORE_BASE_64 }}

      - name: Install dependencies (web)
        run: npm ci

      - name: Install dependencies (capacitor)
        working-directory: ${{ env.CAPACITOR_PROJECT_DIR }}
        run: npm ci

      - name: Build web assets
        working-directory: ${{ env.CAPACITOR_PROJECT_DIR }}
        run: npm run build-www
        env:
          COMMIT_HASH: ${{ github.sha }}
          COMMIT_TAG: "app-${{ github.run_number }}"

      - name: Fix gradlew permissions
        working-directory: ${{ env.CAPACITOR_PROJECT_DIR }}
        run: chmod +x ./android/gradlew

      - name: Build and sign APK
        working-directory: ${{ env.CAPACITOR_PROJECT_DIR }}
        run: npm run build-android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/.keystore/keystore.jks
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION: "1.0.${{ github.run_number }}"

      - name: Copy signed APK
        run: cp ${{ env.CAPACITOR_PROJECT_DIR }}/android/app/build/outputs/apk/release/app-release-signed.apk "${{ runner.temp }}/niimblues.apk"

      - name: Publish APK to the "app-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-latest"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "NiimBlue — приложение (последняя сборка)" \
              --notes "Скачай niimblues.apk ниже и установи на телефон." \
              --prerelease
          fi
          gh release upload "$TAG" "${{ runner.temp }}/niimblues.apk" --clobber
